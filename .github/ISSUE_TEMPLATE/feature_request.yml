name: Feature request
description: Propose a capability or improvement
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can an athlete or coach not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: signals
    attributes:
      label: Data required
      description: Which band signals, sessions or video inputs does this depend on?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: Works on a 390px-wide screen
        - label: No fabricated or placeholder metrics
        - label: Respects role gating where relevant
